# ============================================================
# 门诊预约与分诊协作智能体系统 · 全局配置文件（Phase 1）
# 规范：密钥、模型地址、数据库路径一律放本文件，禁止写死在代码里
# ============================================================

# 服务监听配置
server:
  host: "127.0.0.1"        # 监听地址（试点阶段只绑本机，不对外暴露）
  port: 8000               # 监听端口

# 数据库配置（SQLite 单机，不引入任何外部中间件）
database:
  url: "sqlite:///./app/data/clinic.db"   # SQLite 连接串，路径相对于项目根目录

# 安全配置（登录令牌签名密钥，上线前必须更换为随机值）
security:
  secret_key: "CHANGE_ME_TO_A_RANDOM_SECRET_BEFORE_PILOT"  # 令牌签名密钥【上线前必须更换】
  token_expire_minutes: 480                               # 令牌有效期（分钟），默认 8 小时一个班次
  password_salt: "clinic-phase1-salt"                     # 口令加盐（试点演示用，正式环境须逐用户独立盐）

# 模型接入配置（Phase 2 使用，OpenAI 兼容接口；Phase 1 留空占位）
model:
  base_url: ""             # 模型服务地址（不写死在代码里）
  api_key: ""              # 模型密钥（不写死在代码里）
  model_name: ""           # 模型名称（不写死在代码里）

# RBAC 六角色定义（对应访谈事实 f41：禁止借用账号，账号绑定角色）
roles:
  nurse: "导诊护士"          # 一线操作：查建议/暂存草稿/发起转人工
  scheduler: "排班管理员"    # 整理校核/发起复核/核对异常/分派异常
  director: "门诊运营主任"   # 定范围/停止/验收
  engineer: "门诊系统工程师" # 维护只读接口/数据校验/修复队列
  service: "患者服务主管"    # 受理争议/参与服务结果验收
  qc: "医疗质控专员"         # 审计查询/否决上线/复核留存

# 授权岗位可查看的数据范围（访谈事实 f41：只有授权岗位可看号源、排班、签到叫号时间与分诊规则）
data_scope:
  - "schedule"   # 号源与医生排班（只读）
  - "queue"      # 签到与叫号时间（只读）
  - "rules"      # 分诊规则（只读）
